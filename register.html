<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng ký - Thế Giới Địa Ốc</title>
  <link rel="stylesheet" href="./css/main.css">
  <link rel="stylesheet" href="./css/auth.css">
  <link rel="stylesheet" href="css/reponsive.css">
  <link rel="icon" type="image/png" sizes="32x32" href="./img/favicon-32x32.png">
</head>
<body class="auth-page">
  <div class="auth-card">
    <h1 id="tap">MINDX CINEMA</h1>
    <h2>Đăng ký</h2>
    <p class="sub">Tạo tài khoản để tiếp tục</p>
    <form id="register-form">
      <label for="username">Tên người dùng</label>
      <input id="username" type="text" placeholder="Nhập username" required>
      <label for="email">Email</label>
      <input id="email" type="email" placeholder="example@gmail.com" required>
      <label for="password">Mật khẩu</label>
      <input id="password" type="password" placeholder="Nhập mật khẩu" required>
      <button type="submit">Sign Up</button>
    </form>
        <p id="Errorsl"></p>
        <p id="Passsl"></p>
    <p class="switch">Đã có tài khoản? <a href="./login.html">Đăng nhập</a></p>
  </div>
  <script src="./js/register.js"></script>
</body>
</html>
