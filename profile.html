<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thông Tin Tài Khoản - Thế Giới Địa Ốc</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/about.css">
  <link rel="stylesheet" href="css/home.css">
  <link rel="stylesheet" href="css/profile.css">
  <link rel="stylesheet" href="css/reponsive.css">
  <link rel="icon" type="image/png" sizes="32x32" href="./img/favicon-32x32.png">
</head>
<body>
  <!-- header -->
  <header class="topbar">
    <a class="brand" href="./index.html">THEGIOIDIAOC.COM</a>
    <div class="user-area">
      <a href="index.html" id="index-btn">Trang chủ</a>
      <a href="feedback.html" id="about-btn">Góp ý</a>
      <a href="news.html" id="about-btn">Tin tức</a>
      <a href="about.html" id="about-btn">Giới thiệu</a>

        <!--phần avatar-->
        <div class="user-menu-container">
          <div id="avatarMenuBtn" class="header-avatar-btn">
            <img id="headerAvatarImg" src="https://scontent.fsgn5-13.fna.fbcdn.net/v/t1.30497-1/453178253_471506465671661_2781666950760530985_n.png?stp=dst-png&cstp=mx2048x2048&ctp=s200x200&_nc_cat=1&ccb=1-7&_nc_sid=a51fdb&_nc_ohc=y_mL2_aG1XYQ7kNvwHP7Och&_nc_oc=AdoqztSznaNCSUz7nZCI6sZoPOqVl94_Dr4538VbnQBmaqAiXBjiLIWvFoIcMat5te4&_nc_zt=24&_nc_ht=scontent.fsgn5-13.fna&_nc_ss=7b2a8&oh=00_AQNMYK32urcOXlAC4k3h8o3JIZ04iLLO7JFCXm4tsExtxw&oe=6AF18A3A" alt="Avatar">
          </div>
          <div id="dropdownMenu" class="user-dropdown-menu">
            <a href="profile.html" class="dropdown-item">Thông tin tài khoản</a>
            <a href="product.html" class="dropdown-item">BDS của bạn</a>
            <a id="logoutBtn" class="dropdown-item logout-item">Đăng xuất</a>
          </div>
        </div>
    </div>
  </header>

  <!--phần thông tin tài khoản-->
  <main>
    <section class="profile-section">
      <div class="profile-container">
        <h2>Thông Tin Tài Khoản</h2>
        <!-- Form chia bố cục 2 cột -->
        <form id="profileForm" class="profile-layout-form">
          <!-- CỘT TRÁI: AVATAR & NÚT ĐỔI ẢNH -->
          <div class="profile-sidebar">
            <div class="avatar-wrapper">
              <img id="avatarPreview" src="https://scontent.fsgn5-13.fna.fbcdn.net/v/t1.30497-1/453178253_471506465671661_2781666950760530985_n.png?stp=dst-png&cstp=mx2048x2048&ctp=s200x200&_nc_cat=1&ccb=1-7&_nc_sid=a51fdb&_nc_ohc=y_mL2_aG1XYQ7kNvwHP7Och&_nc_oc=AdoqztSznaNCSUz7nZCI6sZoPOqVl94_Dr4538VbnQBmaqAiXBjiLIWvFoIcMat5te4&_nc_zt=24&_nc_ht=scontent.fsgn5-13.fna&_nc_ss=7b2a8&oh=00_AQNMYK32urcOXlAC4k3h8o3JIZ04iLLO7JFCXm4tsExtxw&oe=6AF18A3A" alt="Avatar">
            </div>
            <label for="avatarInput" class="btn-upload-label">
            Đổi Ảnh Đại Diện
            </label>
            <input type="file" id="avatarInput" accept="image/*">
          </div>

          <!-- CỘT PHẢI: THÔNG TIN TÀI KHOẢN & NÚT LƯU -->
          <div class="profile-main-content">
            <div class="form-group">
              <label for="fullName">Họ và Tên</label>
              <input type="text" id="fullName" required>
            </div>
            <div class="form-group">
              <label for="email">Địa Chỉ Gmail</label>
              <input type="email" id="email" required>
            </div>
            <div class="form-group">
              <label for="phone">Số Điện Thoại</label>
              <input type="tel" id="phone">
            </div>
            <div class="form-group">
              <label for="password">Mật Khẩu Mới</label>
              <input type="password" id="password" placeholder="••••••••">
            </div>
            <div id="Errorsl" style="color: red; margin-bottom: 10px; font-size: 14px;"></div>
            <div id="Passsl" style="margin-bottom: 10px; font-size: 14px;"></div>
            <button type="submit" class="btn-save">Lưu Thay Đổi</button>
          </div>
        </form>
      </div>
    </section>
  </main>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="footer-container">
      <div class="footer-links">
        <a href="index.html">Trang chủ</a>
        <a href="about.html">Giới thiệu</a>
        <a href="profile.html">Thông tin tài khoản</a>
        <a href="product.html">BDS của bạn</a>
      </div>
      <p class="footer-copyright">&copy; 2026 THEGIOIDIAOC.COM. Tất cả quyền được bảo lưu.</p>
    </div>
  </footer>

</body>
</html>
