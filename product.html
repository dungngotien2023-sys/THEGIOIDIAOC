  <main>
    <section class="product-section">
      <div class="product-container">
        <h2>Đăng Tin Bất Động Sản Mới</h2>
        
        <form id="productForm">
          <div class="form-group">
            <label for="title">Tên Bất Động Sản</label>
            <input type="text" id="title" placeholder="Ví dụ: Biệt thự sân vườn cao cấp..." required>
          </div>

          <div class="form-group">
            <label for="price">Giá Bán (VNĐ hoặc Tỷ)</label>
            <input type="text" id="price" placeholder="Ví dụ: 5.5 Tỷ hoặc 2.500.000.000 VNĐ" required>
          </div>

          <div class="form-group">
            <label for="location">Vị Trí</label>
            <input type="text" id="location" placeholder="Ví dụ: Quận 2, TP. Hồ Chí Minh" required>
          </div>

          <div class="form-group">
            <label for="area">Diện Tích (m²)</label>
            <input type="text" id="area" placeholder="Ví dụ: 120 m²" required>
          </div>

          <div class="form-group">
            <label for="description">Mô Tả Chi Tiết</label>
            <textarea id="description" rows="4" placeholder="Mô tả về tiện nghi, pháp lý, hướng nhà..." required></textarea>
          </div>
            <div class="form-group">
            <label for="productImageInput">Hình Ảnh Bất Động Sản</label>
                <input type="file" id="productImageInput" accept="image/*" required>
            </div>
          <!-- Thông báo lỗi hoặc thành công -->
          <div id="Errorsl" style="color: red; margin-bottom: 10px; font-size: 14px;"></div>
          <div id="Passsl" style="margin-bottom: 10px; font-size: 14px;"></div>

          <button type="submit" class="btn-save">Đăng Sản Phẩm</button>
        </form>
        <!-- Thêm phần này bên dưới form đăng sản phẩm trong create-product.html -->
<div class="manage-products-section" style="margin-top: 50px; border-top: 1px solid #292e3a; padding-top: 30px;">
  <h3 style="color: white; margin-bottom: 20px; font-size: 20px; text-align: center;">Quản Lý Sản Phẩm Của Tôi</h3>
  <div id="manageProductList" style="display: flex; flex-direction: column; gap: 15px;">
    <!-- Danh sách sản phẩm sẽ được render tự động bằng JS -->
  </div>
</div>
<!-- Phần hiển thị danh sách tin đã lưu -->
<div class="product-container" style="margin-top: 40px;">

  <div id="savedWishlistContainer">
    <!-- Danh sách tin lưu sẽ được render tự động vào đây -->
  </div>
</div>
